# Publishes @banou/stub to npm and keeps the signed app manifest fresh on both sources.
#
# THE FILENAME IS PART OF THE TRUST RELATIONSHIP AND MUST NOT CHANGE. npm trusted publishing binds
# the package to a repository PLUS a workflow filename (banou26/stub + publish-lib.yml on npmjs.org),
# so renaming this file breaks publishing and needs reconfiguring on npmjs.org by hand. The `name:` below is display text and is safe to edit.
# There is no npm token anywhere: the job exchanges its OIDC identity for a short lived credential.
#
# Two halves, and only the first runs on every push:
#
#   1. Re-sign fkn.json and commit it back to main. The manifest carries an `issuedAt`, so a copy
#      that never moves gets older than everything around it; a fresh one lands on anime.fkn.app
#      because Cloudflare Pages builds this branch. `paths-ignore` lists fkn.json so the commit
#      cannot start this workflow again, and a push made with GITHUB_TOKEN starts nothing anyway.
#   2. Build and publish, but only when package.json names a version the registry does not have.
#
# The manifest is signed with FKN_SIGNING_KEY, the raw subkey seed the Developers tab on fkn.app
# emits. It is a member of the key list in keys.json; the root key that signed that list is not here
# and never should be, so this workflow can sign releases and cannot change who may sign them.
name: Publish

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      # the loop guard: the re-sign step below commits exactly this file and nothing else
      - 'fkn.json'
  # for re-running a publish that failed after the version already landed, which a push cannot repeat
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # the OIDC token npm exchanges for short lived publish credentials
      id-token: write
      # only to push the re-signed manifest back to main
      contents: write

    steps:
      - uses: actions/checkout@v5

      # NO registry-url on purpose. That input writes an .npmrc pinning the auth token to
      # ${NODE_AUTH_TOKEN}, which is empty here and can turn trusted publishing into an ENEEDAUTH.
      # registry.npmjs.org is npm's default, so nothing is lost by leaving it alone.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships something recent enough today,
      # which is exactly why this is pinned rather than assumed: the day the runner image moves, an
      # unpinned npm would fail at the publish step with an auth error that looks like a revoked
      # credential rather than a stale CLI.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version)"

      - run: npm ci

      # A fresh issuedAt on every publish. The secret holds the raw signing seed, so nothing here
      # prints it and fkn-sign reads it straight out of the environment.
      - name: Sign the manifest
        env:
          FKN_SIGNING_KEY: ${{ secrets.FKN_SIGNING_KEY }}
        run: npx fkn-sign sign --keys keys.json --sources npm:@banou/stub,https:anime.fkn.app --name Stub --out fkn.json

      # Both sources, because `sources` is what decides which caller the platform will accept this
      # manifest from, and a signature that verifies says nothing about that list being right.
      - name: Verify it for both sources
        run: |
          npx fkn-sign verify fkn.json --source npm:@banou/stub
          npx fkn-sign verify fkn.json --source https:anime.fkn.app

      # Only when it actually moved, so a re-run of an unchanged tree is a no-op rather than a commit.
      # The rebase covers the one race the concurrency group cannot: an older run pushing on top of a
      # newer main. A conflict there is not worth failing a publish over, since the next push re-signs.
      - name: Commit the re-signed manifest
        run: |
          if git diff --quiet -- fkn.json; then
            echo "::notice::fkn.json is unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fkn.json
          git commit -m 'chore: 🧹re-sign fkn.json'
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "::warning::main moved and fkn.json conflicts; the next push re-signs it"
            exit 0
          fi
          git push origin HEAD:main

      # Decide BEFORE building, so an unchanged version costs seconds rather than a full build.
      #
      # Asked over HTTP rather than through `npm view`, which answers from a cache that a lookup made
      # shortly before a publish can leave holding a negative. The VERSION document is the definitive
      # answer, and it separates the three facts a gate needs: 200 is published, 404 is not, and
      # anything else is the registry not answering, which is not evidence either way.
      - name: Decide whether the version moved
        id: decide
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@banou%2fstub/$VERSION")
          if [ "$CODE" = "200" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@banou/stub $VERSION is already published; nothing to do."
          elif [ "$CODE" = "404" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing @banou/stub $VERSION"
          else
            echo "::error::the registry answered $CODE for @banou/stub $VERSION. Refusing to guess."
            exit 1
          fi

      # `npm run build` also runs `fkn-sign check`, which refuses when `files` would leave fkn.json
      # out of the tarball, and `fkn-sign place`, which puts it at build/.well-known/fkn.json for the
      # https source. So the two things a consumer reads are both produced here.
      - name: Build
        if: steps.decide.outputs.changed == 'true'
        run: npm run build

      # No credential is passed. npm exchanges the job's OIDC identity for a short lived token against
      # the trusted publisher configured on npmjs.org for banou26/stub + publish-lib.yml. BOTH HALVES
      # ARE THE TRUST RELATIONSHIP: renaming this file breaks publishing, and so does renaming the
      # repo. The file was born as publish.yml and the exchange answered "package not found" until it
      # matched the registered name (2026-09-11).
      # Provenance is attested automatically under trusted publishing; --provenance says so out loud.
      - name: Publish
        if: steps.decide.outputs.changed == 'true'
        # verbose so the identity exchange's answer is in the log: a trusted publisher that does not
        # match this repository and filename otherwise surfaces only as a bare ENEEDAUTH
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish --access public

      # Ask the REGISTRY, not the runner. Everything above is a claim about what was uploaded; this is
      # the only step that observes what a consumer would actually get.
      - name: Confirm the registry serves it
        if: steps.decide.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@banou%2fstub/$VERSION")
            if [ "$CODE" = "200" ]; then
              echo "::notice::the registry serves @banou/stub $VERSION"
              exit 0
            fi
            echo "attempt $attempt: the registry answered $CODE"
            sleep 15
          done
          echo "::error::the registry still does not serve @banou/stub $VERSION"
          exit 1
